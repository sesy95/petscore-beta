    // Converte un prodotto trovato online includendo la FOTO REALE E-COMMERCE
    function normalizeExternalFoodItem(p) {
      const cleanEan = p.code || String(Date.now());
      const nut = p.nutriments || {};
      const rawText = (p.ingredients_text_it || p.ingredients_text || '').toLowerCase();
      const fullTitle = `${p.product_name_it || p.product_name || ''} ${p.categories || ''}`.toLowerCase();
      const isCat = fullTitle.includes('cat') || fullTitle.includes('chat') || fullTitle.includes('gatto') || fullTitle.includes('gatti') || fullTitle.includes('feline') || fullTitle.includes('felix') || fullTitle.includes('sheba') || fullTitle.includes('whiskas');
      const isWet = fullTitle.includes('umido') || fullTitle.includes('mousse') || fullTitle.includes('pat') || fullTitle.includes('gelatina') || fullTitle.includes('busta') || fullTitle.includes('filett') || Number(nut['moisture_100g']) > 50;

      const hasSugar = rawText.includes('zuccher') || rawText.includes('sugar') || rawText.includes('caramel') || rawText.includes('sucre');
      const hasGenericMeat = rawText.includes('carni e derivati') || rawText.includes('viandes et sous-produits') || rawText.includes('meat and animal derivatives');

      return {
        id: `prod-${cleanEan}`,
        ean: cleanEan,
        category: 'food',
        subCategory: isWet ? 'Cibo Umido' : 'Cibo Secco',
        targetSpecies: isCat ? 'cat' : 'dog',
        name: p.product_name_it || p.product_name || `Alimento (${cleanEan})`,
        brand: p.brands ? p.brands.split(',')[0].trim() : 'Linea Pet',
        priceAvg: 'Vedi offerte',
        packSize: p.quantity || 'Formato standard',
        imageUrl: p.image_front_small_url || p.image_front_url || p.image_url || '',
        confidenceScore: p.ingredients_text ? 92 : 82,
        kibbleSizeMm: isWet ? null : 10,
        ingredientsText: p.ingredients_text_it || p.ingredients_text || 'Composizione analitica verificata tramite codice EAN.',
        proteinSourceScore: hasGenericMeat ? 9 : 21,
        carbFatQualityScore: 8,
        labelTransparencyScore: p.ingredients_text ? 8 : 6,
        hasAddedSugars: hasSugar,
        hasChemicalPreservatives: false,
        hasFunctionalBonus: rawText.includes('omega') || rawText.includes('glucosamin') || rawText.includes('taurin') || rawText.includes('inulin'),
        analytical: {
          protein: Number(nut.proteins_100g) || (isWet ? 10.0 : 25.0),
          fat: Number(nut.fat_100g) || (isWet ? 5.0 : 13.5),
          fiber: Number(nut.fiber_100g) || (isWet ? 0.6 : 2.8),
          ash: Number(nut['ash_100g']) || (isWet ? 2.0 : 6.8),
          moisture: Number(nut['moisture_100g']) || (isWet ? 80.0 : 10.0)
        },
        prices: [
          { store: 'Amazon', price: 'Verifica Prezzo', note: 'Consegna rapida', url: `https://www.amazon.it/s?k=${encodeURIComponent((p.brands || '') + ' ' + (p.product_name_it || p.product_name || cleanEan))}` },
          { store: 'Zooplus', price: 'Confronta', note: 'Store specializzato', url: `https://www.zooplus.it/search/results?q=${encodeURIComponent(p.brands || p.product_name || cleanEan)}` }
        ],
        reviews: []
      };
    }

    // ============================================================================
    // MOTORE DI VALUTAZIONE SU MISURA
    // ============================================================================
    function evaluateProductForPet(product, pet) {
      const allergies = pet.allergies || [];
      const sensitivities = pet.sensitivities || [];
      const ingLower = (product.ingredientsText || '').toLowerCase() + ' ' + (product.name || '').toLowerCase();

      if (product.category === 'non-food') {
        const commAvg = product.nonFoodMetrics
          ? product.nonFoodMetrics.reduce((acc, m) => acc + m.score, 0) / product.nonFoodMetrics.length
          : 85;
        const baseScore = Math.round(product.nonFoodBaseTechScore * 0.5 + commAvg * 0.5);
        let matchScore = baseScore;
        const alerts = [];

        if (product.toxicForCats && pet.species === 'cat') {
          matchScore = 0;
          alerts.push({
            type: 'danger',
            title: `Pericoloso per ${pet.name}`,
            desc: 'Contiene Piretroidi (Deltametrina/Permetrina): neurotossici e letali per i gatti.'
          });
        } else if (product.cautionForVeryOldTinyDogs && pet.species === 'dog' && (pet.ageYears >= 10 || sensitivities.includes('skin')) && pet.weightKg <= 7) {
          matchScore -= 18;
          alerts.push({
            type: 'warning',
            title: `Cautela per la cute di ${pet.name}`,
            desc: 'Su cani senior di taglia piccola monitorare eventuali arrossamenti sul collo nelle prime 48 ore.'
          });
        } else {
          alerts.push({
            type: 'success',
            title: `Adatto e sicuro per ${pet.name}`,
            desc: 'Nessuna controindicazione rilevata per specie, taglia ed età.'
          });
        }
        return { baseScore: Math.max(0, Math.min(100, baseScore)), matchScore: Math.max(0, Math.min(100, matchScore)), dmb: null, doseInfo: null, alerts };
      }

      const { protein, fat, fiber, ash, moisture } = product.analytical;
      const dryMatter = Math.max(1, 100 - moisture);
      const nfeLabel = Math.max(0, 100 - (protein + fat + fiber + ash + moisture));

      const dmb = {
        dryMatter: +dryMatter.toFixed(1),
        protein: +((protein / dryMatter) * 100).toFixed(1),
        fat: +((fat / dryMatter) * 100).toFixed(1),
        fiber: +((fiber / dryMatter) * 100).toFixed(1),
        ash: +((ash / dryMatter) * 100).toFixed(1),
        carbs: +((nfeLabel / dryMatter) * 100).toFixed(1),
        nfeLabel: +nfeLabel.toFixed(1)
      };

      const rer = 70 * Math.pow(Math.max(1, Number(pet.weightKg) || 5), 0.75);
      let kFactor = pet.species === 'cat' ? 1.2 : 1.4;
      if (pet.ageYears >= 9) kFactor = 1.15;
      if (pet.bodyCondition === 'overweight') kFactor *= 0.85;
      if (pet.bodyCondition === 'underweight') kFactor *= 1.15;

      const dailyKcalNeeded = Math.round(rer * kFactor);
      const productKcalPer100g = Math.max(45, Math.round(protein * 3.5 + fat * 8.5 + nfeLabel * 3.5));
      const dailyGrams = Math.max(15, Math.round((dailyKcalNeeded / productKcalPer100g) * 100));

      const doseInfo = {
        dailyGrams,
        perMealGrams: Math.round(dailyGrams / 2),
        dailyKcalNeeded
      };

      const scoreA = (product.proteinSourceScore || 18) + (product.carbFatQualityScore || 7) + (product.labelTransparencyScore || 6);
      const isCatFood = product.targetSpecies === 'cat';

      let protPts = isCatFood ? (dmb.protein >= 35 && dmb.protein <= 54 ? 15 : 6) : (dmb.protein >= 22 && dmb.protein <= 38 ? 15 : 9);
      let carbPts = isCatFood ? (dmb.carbs <= 15 ? 10 : dmb.carbs <= 25 ? 6 : 1) : (dmb.carbs <= 35 ? 10 : dmb.carbs <= 46 ? 6 : 2);
      let fatPts = dmb.fat >= 10 && dmb.fat <= 22 ? 5 : 2;
      let ashPts = dmb.ash <= 7.8 ? 5 : dmb.ash <= 9.0 ? 3 : 0;
      const scoreB = protPts + carbPts + fatPts + ashPts;

      let scoreC = 12;
      if (product.hasFunctionalBonus) scoreC += 8;
      if (product.hasAddedSugars) scoreC -= 15;
      if (product.hasChemicalPreservatives) scoreC -= 10;
      scoreC = Math.max(0, Math.min(20, scoreC));

      const baseScore = Math.max(0, Math.min(100, Math.round(scoreA + scoreB + scoreC)));
      let matchScore = baseScore;
      const alerts = [];

      if (product.targetSpecies !== pet.species) {
        matchScore = 15;
        alerts.push({
          type: 'danger',
          title: `Formulato per ${product.targetSpecies === 'cat' ? 'Gatti' : 'Cani'}`,
          desc: `Non adatto alle esigenze metaboliche di ${pet.name}.`
        });
        return { baseScore, matchScore, dmb, doseInfo, alerts };
      }

      const triggeredAllergies = [];
      allergies.forEach(alId => {
        const foundOpt = ALLERGY_OPTIONS.find(o => o.id === alId);
        if (foundOpt && foundOpt.keywords.some(kw => ingLower.includes(kw))) {
          triggeredAllergies.push(foundOpt.label);
        }
      });

      if (triggeredAllergies.length > 0) {
        matchScore = 12;
        alerts.push({
          type: 'danger',
          title: `Contiene ${triggeredAllergies.join(', ')}`,
          desc: `Presente negli ingredienti ma escluso nel profilo di ${pet.name}.`
        });
      }

      const needsRenalCare = pet.ageYears >= 9 || sensitivities.includes('renal');
      if (needsRenalCare) {
        if (dmb.ash > 7.8 || dmb.protein > 36) {
          matchScore -= 38;
          alerts.push({
            type: 'danger',
            title: `Carico renale elevato per ${pet.name}`,
            desc: `Minerali (${dmb.ash}% DMB) e proteine (${dmb.protein}% DMB) troppo alti per i reni.`
          });
        } else if (triggeredAllergies.length === 0) {
          matchScore += 6;
          alerts.push({
            type: 'success',
            title: `Delicato sui reni di ${pet.name}`,
            desc: `Minerali contenuti (${dmb.ash}% DMB) e proteine bilanciate.`
          });
        }
      }

      const needsMiniKibble = (pet.species === 'dog' && pet.weightKg <= 9) || sensitivities.includes('dental');
      if (needsMiniKibble && product.kibbleSizeMm) {
        if (product.kibbleSizeMm > 10) {
          matchScore -= 16;
          alerts.push({
            type: 'warning',
            title: `Crocchetta grande (${product.kibbleSizeMm} mm)`,
            desc: `Impegnativa da masticare per ${pet.name}. Ideale < 9 mm.`
          });
        } else if (triggeredAllergies.length === 0) {
          matchScore += 4;
          alerts.push({
            type: 'success',
            title: `Crocchetta Mini (${product.kibbleSizeMm} mm)`,
            desc: `Facile da masticare per ${pet.name}.`
          });
        }
      }

      if (product.hasAddedSugars) {
        matchScore -= 22;
        alerts.push({
          type: 'danger',
          title: 'Contiene zuccheri aggiunti',
          desc: 'Sconsigliati per salute dentale e peso.'
        });
      }

      if (alerts.length === 0) {
        alerts.push({
          type: 'success',
          title: `Ideale per ${pet.name}`,
          desc: 'Ricetta bilanciata per la sua età e taglia.'
        });
      }

      return {
        baseScore,
        matchScore: Math.max(0, Math.min(100, Math.round(matchScore))),
        dmb,
        doseInfo,
        alerts
      };
    }

    function getBadgeStyle(score) {
      if (score >= 75) return { bg: 'bg-emerald-500', softBg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-200', label: 'Consigliato' };
      if (score >= 50) return { bg: 'bg-amber-500', softBg: 'bg-amber-50', text: 'text-amber-700', border: 'border-amber-200', label: 'Con riserva' };
      return { bg: 'bg-rose-500', softBg: 'bg-rose-50', text: 'text-rose-700', border: 'border-rose-200', label: 'Evitare' };
    }

      const evaluatedProducts = useMemo(() => products.map(p => ({ ...p, eval: evaluateProductForPet(p, activePet) })), [products, activePet]);
      const selectedProduct = useMemo(() => evaluatedProducts.find(p => p.id === selectedProductId) || evaluatedProducts[0], [evaluatedProducts, selectedProductId]);

      const filteredProducts = useMemo(() => {
        return evaluatedProducts.filter(p => {
          const mCat = categoryFilter === 'all' || p.category === categoryFilter;
          const mQuery = !searchQuery.trim() ||
            p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            p.brand.toLowerCase().includes(searchQuery.toLowerCase()) ||
            p.ingredientsText.toLowerCase().includes(searchQuery.toLowerCase()) ||

          return mCat && mQuery;

      const openPetEditor = (petToEdit = null) => {

          setEditingPetId(petToEdit.id);
          setPetName(petToEdit.name);
          setPetSpecies(petToEdit.species);
          setPetBreed(petToEdit.breed);
          setPetAge(petToEdit.ageYears);
          setPetWeight(petToEdit.weightKg);
          setPetAvatar(petToEdit.avatarStyle);
          setPetTheme(petToEdit.theme);
          setPetSterilized(petToEdit.sterilized ?? true);
          setPetBodyCondition(petToEdit.bodyCondition || 'ideal');
          setPetAllergies(petToEdit.allergies || []);
          setPetSensitivities(petToEdit.sensitivities || []);
        } else {
          setEditingPetId(null);
          setPetName('');
          setPetSpecies('dog');
          setPetBreed('');
          setPetAge(4);
          setPetWeight(8);
          setPetAvatar('pinscher');
          setPetTheme('sage');
          setPetSterilized(true);
          setPetBodyCondition('ideal');
          setPetAllergies([]);
          setPetSensitivities([]);
        }
        setFlowStep('pet-setup');
      };

      const toggleArrayItem = (arr, setArr, id) => {
        if (arr.includes(id)) setArr(arr.filter(x => x !== id));
        else setArr([...arr, id]);
      };

      const handleSavePet = () => {
        if (!petName.trim()) {
          showToast('Inserisci il nome del tuo Pet');
          setWizardStep(1);
          return;
        }
        const petObj = {
          id: editingPetId || `pet-${Date.now()}`,
          name: petName.trim(),
          species: petSpecies,
          breed: petBreed.trim() || (petSpecies === 'dog' ? 'Meticcio' : 'Europeo'),
          ageYears: Number(petAge) || 3,
          weightKg: Number(petWeight) || 5,
          avatarStyle: petAvatar,
          theme: petTheme,
          sterilized: petSterilized,
          bodyCondition: petBodyCondition,
          allergies: petAllergies,
          sensitivities: petSensitivities
        };

        if (editingPetId) {
          setPets(prev => prev.map(p => p.id === editingPetId ? petObj : p));
          showToast(`Profilo di ${petObj.name} aggiornato`);
        } else {
          setPets(prev => [...prev, petObj]);
          setActivePetId(petObj.id);
          showToast(`Benvenuto ${petObj.name}!`);
        }
        setFlowStep('home');
      };

      const startRealCamera = () => {
        setCameraError('');
        setCameraActive(true);
        setTimeout(() => {
          if (!window.Html5Qrcode) {
            setCameraError('Fotocamera non supportata su questo browser.');
            return;
          }
          const html5QrCode = new window.Html5Qrcode("BarcodeReaderBox");
          qrScannerRef.current = html5QrCode;
          html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 240, height: 130 } },
            (decodedText) => {
              stopRealCamera();
              setEanInput(decodedText);
              lookupBarcodeEAN(decodedText);
            },
            () => {}
          ).catch(() => {
            setCameraError('Permesso fotocamera non attivo. Inserisci il codice EAN qui sotto.');
            setCameraActive(false);
          });
        }, 200);
      };

      const stopRealCamera = () => {
        if (qrScannerRef.current) {
          qrScannerRef.current.stop().catch(() => {}).finally(() => {
            qrScannerRef.current = null;
            setCameraActive(false);
          });
        } else {
          setCameraActive(false);
        }
      };

      const lookupBarcodeEAN = async (codeToSearch) => {
        const clean = (codeToSearch || eanInput).trim();
        if (!clean) return;
        const localHit = products.find(p => p.ean === clean);
        if (localHit) {
          setSelectedProductId(localHit.id);
          setShowScannerModal(false);
          setOpenAccordion('');
          setFlowStep('product');
          return;
        }

        setEanLoading(true);
        try {
          const res = await fetch(`https://world.openpetfoodfacts.org/api/v0/product/${clean}.json`);
          const data = await res.json();
          if (data && data.status === 1 && data.product) {
            const imported = normalizeExternalFoodItem({ ...data.product, code: clean });
            setProducts(prev => [imported, ...prev]);
            setSelectedProductId(imported.id);
            setShowScannerModal(false);
            setOpenAccordion('');
            setFlowStep('product');
            if (supabaseClient) {
              supabaseClient.from('products').upsert([{ id: imported.id, ean: imported.ean, product_data: imported }]).then(() => {});
            }
          } else {
            setShowScannerModal(false);
            setNewProdEan(clean);
            setShowAddProductModal(true);
          }
        } catch (_) {
          showToast('Controlla la connessione.');
        } finally {
          setEanLoading(false);
        }
      };

      const handleCreateNewProduct = async (e) => {
        e.preventDefault();
        if (!newProdName.trim()) return;
        const code = newProdEan.trim() || String(Math.floor(8000000000000 + Math.random() * 900000000000));
        const createdProd = {
          id: `prod-${code}`,
          ean: code,
          category: newProdCat,
          subCategory: newProdCat === 'food' ? 'Cibo Secco' : 'Accessori & Cura',
          targetSpecies: activePet.species,
          name: newProdName.trim(),
          brand: newProdBrand.trim() || 'Linea Pet',
          priceAvg: 'Vedi offerte',
          packSize: 'Formato standard',
          imageUrl: '',
          confidenceScore: 90,
          kibbleSizeMm: newProdCat === 'food' ? 9 : null,
          ingredientsText: newProdIng.trim() || 'Ingredienti inseriti dalla community.',
          proteinSourceScore: 21, carbFatQualityScore: 8, labelTransparencyScore: 8,
          hasAddedSugars: false, hasChemicalPreservatives: false, hasFunctionalBonus: true,
          analytical: {
            protein: Number(newProdProt) || 25,
            fat: Number(newProdFat) || 13,
            fiber: 3.0,
            ash: Number(newProdAsh) || 6.5,
            moisture: 10.0

          nonFoodBaseTechScore: 88,
          nonFoodMetrics: [

          prices: [
            { store: 'Amazon', price: 'Verifica Prezzo', note: 'Ricerca diretta', url: `https://www.amazon.it/s?k=${encodeURIComponent(newProdBrand + ' ' + newProdName)}` }
          ],
          reviews: []
        };

        setProducts(prev => [createdProd, ...prev]);
        setSelectedProductId(createdProd.id);
        setShowAddProductModal(false);
        setOpenAccordion('');
        setFlowStep('product');

        if (supabaseClient) {
          supabaseClient.from('products').upsert([{ id: createdProd.id, ean: createdProd.ean, product_data: createdProd }]).then(() => {});
        }

        if (newProdCat === 'food') {
          try {
            const formData = new URLSearchParams();
            formData.append('code', code);
            formData.append('product_name', createdProd.name);
            formData.append('brands', createdProd.brand);
            formData.append('ingredients_text', createdProd.ingredientsText);
            fetch('https://world.openpetfoodfacts.org/cgi/product_jqm2.pl', { method: 'POST', mode: 'no-cors', body: formData }).catch(() => {});
          } catch (_) {}
        }
        showToast('Prodotto salvato e valutato');
      };

        const author = revAuthor.trim() || `Proprietario di ${activePet.name}`;
        const petDesc = `${activePet.breed} • ${activePet.ageYears} anni • ${activePet.weightKg} kg`;

        const newRev = {
          id: `rev-${Date.now()}`,
          userName: author,
          petInfo: petDesc,
          rating: Number(revRating),
          comment: revComment.trim(),
          verifiedScan: true
        };

        setProducts(prev => prev.map(p => p.id === selectedProduct.id ? { ...p, reviews: [newRev, ...p.reviews] } : p));
        setRevComment('');

        if (supabaseClient) {
          await supabaseClient.from('reviews').insert([{
            product_id: selectedProduct.id,
            product_name: selectedProduct.name,
            user_name: author,
            pet_info: petDesc,
            rating: Number(revRating),

                    >
                      <span>🛒 Confronta Prezzi Online ({selectedProduct.prices.length} negozi)</span>
                      <span className="text-xs text-slate-400">{openAccordion === 'prices' ? 'Chiudi ▲' : 'Apri ▼'}</span>
                    </button>
                    {openAccordion === 'prices' && (
                      <div className="px-4 pb-5 space-y-2 border-t border-slate-100 pt-3.5">
                        {selectedProduct.prices.map((pr, idx) => (
                          <a key={idx} href={pr.url} target="_blank" rel="noopener noreferrer" className="flex items-center justify-between p-3.5 rounded-2xl bg-[#F5F5F7] hover:bg-emerald-50 transition">
                            <div>
                              <div className="text-xs font-extrabold text-slate-900">{pr.store}</div>
                              <div className="text-[11px] text-emerald-700 font-medium">{pr.note}</div>
                            </div>
                            <div className="text-sm font-black text-emerald-600">{pr.price} →</div>
                          </a>
                        ))}
                      </div>
                    )}
                  </div>
                </section>
              </div>
            )}
          </main>

          {/* ====================================================================
              BARRA DI NAVIGAZIONE INFERIORE DOMINANTE (STILE APPLE DOCK FLOTTANTE)
          ==================================================================== */}
          <nav className="fixed bottom-4 inset-x-0 mx-auto w-[92%] max-w-[400px] apple-dock rounded-[30px] px-4 py-2.5 flex items-center justify-around z-40 border border-slate-200/80">
            <button
              onClick={() => setFlowStep('home')}
              className={`flex flex-col items-center gap-0.5 px-3 py-1 rounded-2xl transition ${
                flowStep === 'home' ? 'text-slate-900 font-extrabold scale-105' : 'text-slate-400 font-semibold'
              }`}
            >
              <span className="text-xl leading-none">🏠</span>
              <span className="text-[11px]">Catalogo</span>
            </button>

            <button
              onClick={() => setShowScannerModal(true)}
              className="bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white px-6 py-3.5 rounded-[24px] font-black text-xs shadow-xl shadow-emerald-500/30 -mt-7 border-4 border-[#F5F5F7] flex items-center gap-2 transition"
            >
              <span className="text-base leading-none">📷</span>
              <span className="tracking-wide">SCAN / EAN</span>
            </button>

            <button
              onClick={() => openPetEditor(activePet)}
              className={`flex flex-col items-center gap-0.5 px-3 py-1 rounded-2xl transition ${
                flowStep === 'pet-setup' ? 'text-slate-900 font-extrabold scale-105' : 'text-slate-400 font-semibold'
              }`}
            >
              <span className="text-xl leading-none">🐾</span>
              <span className="text-[11px]">Il tuo Pet</span>
            </button>
          </nav>

          {/* MODALE SCANNER CODICE A BARRE */}
          {showScannerModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-[32px] p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-extrabold text-slate-900">Scansiona un prodotto</h3>
                  <button onClick={() => { stopRealCamera(); setShowScannerModal(false); }} className="text-xs font-bold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full">Chiudi</button>
                </div>
                <p className="text-xs text-slate-500">
                  Inquadra il codice a barre sulla confezione oppure digita le 13 cifre del codice EAN.
                </p>
                <div className="bg-slate-900 rounded-3xl p-4 text-center text-white">
                  {!cameraActive ? (
                    <button onClick={startRealCamera} className="w-full py-3.5 rounded-2xl bg-emerald-500 hover:bg-emerald-600 font-extrabold text-xs shadow-md">
                      🎥 Attiva Fotocamera dello Smartphone
                    </button>
                  ) : (
                    <div className="space-y-2">
                      <div id="BarcodeReaderBox" className="w-full rounded-2xl overflow-hidden bg-black"></div>
                      <button onClick={stopRealCamera} className="text-xs text-rose-300 underline">Spegni fotocamera</button>
                    </div>
                  )}
                  {cameraError && <p className="text-[11px] text-amber-300 mt-2">{cameraError}</p>}
                </div>
                <div className="flex gap-2">
                  <input type="text" value={eanInput} onChange={e => setEanInput(e.target.value)} placeholder="Codice EAN (es. 7613035799738)" className="flex-1 px-4 py-3 rounded-2xl bg-slate-100 text-xs font-mono" />
                  <button onClick={() => lookupBarcodeEAN(eanInput)} disabled={eanLoading} className="px-5 py-3 rounded-2xl bg-slate-900 text-white font-bold text-xs">
                    {eanLoading ? '...' : 'Cerca'}
                  </button>
                </div>
                <div className="pt-2 border-t border-slate-100 flex justify-between items-center text-xs">
                  <span className="text-slate-400">Non trovi il prodotto?</span>
                  <button onClick={() => { stopRealCamera(); setShowScannerModal(false); setShowAddProductModal(true); }} className="font-bold text-emerald-600">
                    + Aggiungilo manualmente
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODALE AGGIUNTA PRODOTTO */}
          {showAddProductModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-[32px] p-6 space-y-3.5 max-h-[90vh] overflow-y-auto shadow-2xl">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-extrabold text-slate-900">Nuovo Prodotto</h3>
                  <button onClick={() => setShowAddProductModal(false)} className="text-xs font-bold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full">Chiudi</button>
                </div>
                <form onSubmit={handleCreateNewProduct} className="space-y-3 text-xs">
                  <div className="grid grid-cols-2 gap-2">
                    <button type="button" onClick={() => setNewProdCat('food')} className={`py-2.5 rounded-xl font-bold border ${newProdCat === 'food' ? 'bg-slate-900 text-white' : 'bg-slate-50 text-slate-600'}`}>🥣 Alimento</button>
                    <button type="button" onClick={() => setNewProdCat('non-food')} className={`py-2.5 rounded-xl font-bold border ${newProdCat === 'non-food' ? 'bg-slate-900 text-white' : 'bg-slate-50 text-slate-600'}`}>🛡️ Cura & Accessori</button>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <input type="text" required value={newProdBrand} onChange={e => setNewProdBrand(e.target.value)} placeholder="Marca (es. Monge)" className="px-3.5 py-2.5 rounded-xl bg-slate-100" />
                    <input type="text" value={newProdEan} onChange={e => setNewProdEan(e.target.value)} placeholder="Codice EAN" className="px-3.5 py-2.5 rounded-xl bg-slate-100 font-mono" />
                  </div>
                  <input type="text" required value={newProdName} onChange={e => setNewProdName(e.target.value)} placeholder="Nome prodotto" className="w-full px-3.5 py-2.5 rounded-xl bg-slate-100" />
                  <textarea rows="2" value={newProdIng} onChange={e => setNewProdIng(e.target.value)} placeholder="Ingredienti principali sull'etichetta..." className="w-full px-3.5 py-2.5 rounded-xl bg-slate-100"></textarea>

                  {newProdCat === 'food' && (
                    <div className="grid grid-cols-3 gap-2">
                      <div>
                        <label className="text-[10px] font-bold text-slate-500">% Proteine</label>
                        <input type="number" step="0.5" value={newProdProt} onChange={e => setNewProdProt(e.target.value)} className="w-full mt-1 px-3 py-2 rounded-xl bg-slate-100 font-bold" />
                      </div>
                      <div>
                        <label className="text-[10px] font-bold text-slate-500">% Grassi</label>
                        <input type="number" step="0.5" value={newProdFat} onChange={e => setNewProdFat(e.target.value)} className="w-full mt-1 px-3 py-2 rounded-xl bg-slate-100 font-bold" />
                      </div>
                      <div>
                        <label className="text-[10px] font-bold text-slate-500">% Ceneri</label>
                        <input type="number" step="0.5" value={newProdAsh} onChange={e => setNewProdAsh(e.target.value)} className="w-full mt-1 px-3 py-2 rounded-xl bg-slate-100 font-bold" />
                      </div>
                    </div>
                  )}

                  <div className="p-3 rounded-2xl bg-emerald-50 text-[11px] text-emerald-800">
                    🌱 I dati alimentari contribuiscono anche alla rete gratuita <strong>Open Pet Food Facts</strong>.
                  </div>

                  <button type="submit" className="w-full py-3.5 rounded-2xl bg-emerald-500 text-white font-extrabold">
                    Analizza e Salva
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* MODALE GLOSSARIO & METODO */}
          {showGlossaryModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-[32px] p-6 space-y-3.5 max-h-[85vh] overflow-y-auto shadow-2xl">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-extrabold text-slate-900">Guida semplice agli indici</h3>
                  <button onClick={() => setShowGlossaryModal(false)} className="text-xs font-bold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full">Chiudi</button>
                </div>
                <p className="text-xs text-slate-500 leading-relaxed">
                  Valutiamo ogni prodotto in modo 100% indipendente seguendo le linee guida nutrizionali veterinarie europee.
                </p>
                <div className="space-y-2.5">
                  {ACRONYM_GLOSSARY.map(item => (
                    <div key={item.code} className="p-3.5 rounded-2xl bg-[#F5F5F7]">
                      <div className="text-xs font-extrabold text-slate-900">{item.code} — <span className="text-emerald-700">{item.name}</span></div>
                      <div className="text-[11px] text-slate-600 mt-1 leading-relaxed">{item.desc}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* MODALE FEEDBACK */}
          {showFeedbackModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-[32px] p-6 space-y-3.5 shadow-2xl">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-extrabold text-slate-900">Invia un suggerimento</h3>
                  <button onClick={() => setShowFeedbackModal(false)} className="text-xs font-bold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full">Chiudi</button>
                </div>
                <form onSubmit={handleSendFeedback} className="space-y-3 text-xs">
                  <input type="text" value={fbName} onChange={e => setFbName(e.target.value)} placeholder="Il tuo nome" className="w-full px-4 py-3 rounded-2xl bg-slate-100" />
                  <select value={fbType} onChange={e => setFbType(e.target.value)} className="w-full px-4 py-3 rounded-2xl bg-slate-100 font-bold">
                    <option value="Suggerimento">💡 Idea o consiglio</option>
                    <option value="Prodotto Mancante">📦 Prodotto da aggiungere</option>
                    <option value="Segnalazione">🐞 Segnala un problema</option>
                  </select>
                  <textarea required rows="3" value={fbMessage} onChange={e => setFbMessage(e.target.value)} placeholder="Scrivi qui il tuo messaggio..." className="w-full px-4 py-3 rounded-2xl bg-slate-100"></textarea>
                  <button type="submit" className="w-full py-3.5 rounded-2xl bg-emerald-500 text-white font-extrabold">
                    Invia
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
