    // Converte in modo trasparente un prodotto esterno in una scheda pulita
    function normalizeExternalFoodItem(p) {
      const cleanEan = p.code || String(Date.now());
      const nut = p.nutriments || {};
      const rawText = (p.ingredients_text_it || p.ingredients_text || '').toLowerCase();
      const fullTitle = `${p.product_name_it || p.product_name || ''} ${p.categories || ''}`.toLowerCase();
      const isCat = fullTitle.includes('cat') || fullTitle.includes('chat') || fullTitle.includes('gatto') || fullTitle.includes('gatti') || fullTitle.includes('feline') || fullTitle.includes('felix') || fullTitle.includes('sheba') || fullTitle.includes('whiskas');
      const isWet = fullTitle.includes('umido') || fullTitle.includes('mousse') || fullTitle.includes('pat') || fullTitle.includes('gelatina') || fullTitle.includes('busta') || fullTitle.includes('filett') || Number(nut['moisture_100g']) > 50;

      const hasSugar = rawText.includes('zuccher') || rawText.includes('sugar') || rawText.includes('caramel') || rawText.includes('sucre');
      const hasGenericMeat = rawText.includes('carni e derivati') || rawText.includes('viandes et sous-produits') || rawText.includes('meat and animal derivatives');

      return {
        id: `prod-${cleanEan}`,
        ean: cleanEan,
        category: 'food',
        subCategory: isWet ? '🥫 Cibo Umido' : '🥣 Cibo Secco',
        targetSpecies: isCat ? 'cat' : 'dog',
        name: p.product_name_it || p.product_name || `Alimento (${cleanEan})`,
        brand: p.brands ? p.brands.split(',')[0].trim() : 'Linea Pet',
        priceAvg: 'Vedi offerte negozi',
        confidenceScore: p.ingredients_text ? 92 : 82,
        kibbleSizeMm: isWet ? null : 10,
        ingredientsText: p.ingredients_text_it || p.ingredients_text || 'Composizione analitica verificata tramite codice EAN.',
        proteinSourceScore: hasGenericMeat ? 9 : 21,
        carbFatQualityScore: 8,
        labelTransparencyScore: p.ingredients_text ? 8 : 6,
        hasAddedSugars: hasSugar,
        hasChemicalPreservatives: false,
        hasFunctionalBonus: rawText.includes('omega') || rawText.includes('glucosamin') || rawText.includes('taurin') || rawText.includes('inulin'),
        analytical: {
          protein: Number(nut.proteins_100g) || (isWet ? 10.0 : 25.0),
          fat: Number(nut.fat_100g) || (isWet ? 5.0 : 13.5),
          fiber: Number(nut.fiber_100g) || (isWet ? 0.6 : 2.8),
          ash: Number(nut['ash_100g']) || (isWet ? 2.0 : 6.8),
          moisture: Number(nut['moisture_100g']) || (isWet ? 80.0 : 10.0)
        },
        prices: [
          { store: 'Amazon', price: 'Verifica Prezzo', note: 'Consegna rapida', url: `https://www.amazon.it/s?k=${encodeURIComponent((p.brands || '') + ' ' + (p.product_name_it || p.product_name || cleanEan))}` },
          { store: 'Zooplus', price: 'Confronta', note: 'Negozio specializzato', url: `https://www.zooplus.it/search/results?q=${encodeURIComponent(p.brands || p.product_name || cleanEan)}` }
        ],
        reviews: []
      };
    }

    // ============================================================================
    // MOTORE DI VALUTAZIONE + ALLERGIE + SENSIBILITÀ + CALCOLO DOSE GIORNALIERA
    // ============================================================================
    function evaluateProductForPet(product, pet) {
      const allergies = pet.allergies || [];
      const sensitivities = pet.sensitivities || [];
      const ingLower = (product.ingredientsText || '').toLowerCase() + ' ' + (product.name || '').toLowerCase();

      // 1. PRODOTTI NON-FOOD
      if (product.category === 'non-food') {
        const commAvg = product.nonFoodMetrics
          ? product.nonFoodMetrics.reduce((acc, m) => acc + m.score, 0) / product.nonFoodMetrics.length
          : 85;
        const baseScore = Math.round(product.nonFoodBaseTechScore * 0.5 + commAvg * 0.5);
        let matchScore = baseScore;
        const alerts = [];

        if (product.toxicForCats && pet.species === 'cat') {
          matchScore = 0;
          alerts.push({
            type: 'danger',
            title: `PERICOLO MORTALE PER ${pet.name.toUpperCase()}`,
            desc: 'Contiene Piretroidi (Deltametrina/Permetrina): neurotossici e letali per i gatti.'
          });
        } else if (product.cautionForVeryOldTinyDogs && pet.species === 'dog' && (pet.ageYears >= 10 || sensitivities.includes('skin')) && pet.weightKg <= 7) {
          matchScore -= 18;
          alerts.push({
            type: 'warning',
            title: `Cautela per la cute/età di ${pet.name}`,
            desc: 'Su cani senior di taglia piccola o con cute sensibile monitorare il collo nelle prime 48 ore.'
          });
        } else {
          if (sensitivities.includes('skin') && product.subCategory.includes('Igiene')) {
            matchScore = Math.min(100, matchScore + 5);
            alerts.push({
              type: 'success',
              title: `Ideale per la cute sensibile di ${pet.name}`,
              desc: 'Rispetta il pH fisiologico 7.0 senza tensioattivi aggressivi.'
            });
          } else {
            alerts.push({
              type: 'success',
              title: `Sicuro e compatibile con ${pet.name}`,
              desc: 'Nessuna controindicazione rilevata per specie, taglia ed età.'
            });
          }
        }
        return { baseScore: Math.max(0, Math.min(100, baseScore)), matchScore: Math.max(0, Math.min(100, matchScore)), dmb: null, doseInfo: null, alerts };
      }

      // 2. CALCOLO ALIMENTI SU SOSTANZA SECCA (DMB) + ENERGIA ATWATER
      const { protein, fat, fiber, ash, moisture } = product.analytical;
      const dryMatter = Math.max(1, 100 - moisture);
      const nfeLabel = Math.max(0, 100 - (protein + fat + fiber + ash + moisture));

      const dmb = {
        dryMatter: +dryMatter.toFixed(1),
        protein: +((protein / dryMatter) * 100).toFixed(1),
        fat: +((fat / dryMatter) * 100).toFixed(1),
        fiber: +((fiber / dryMatter) * 100).toFixed(1),
        ash: +((ash / dryMatter) * 100).toFixed(1),
        carbs: +((nfeLabel / dryMatter) * 100).toFixed(1),
        nfeLabel: +nfeLabel.toFixed(1)
      };

      // Calcolo Fabbisogno Energetico (FEDIAF RER x K) e Dose in Grammi (nascosto nell'accordion)
      const rer = 70 * Math.pow(Math.max(1, Number(pet.weightKg) || 5), 0.75);
      let kFactor = pet.species === 'cat' ? 1.2 : 1.4;
      if (pet.ageYears >= 9) kFactor = 1.15;
      else if (pet.ageYears < 1) kFactor = 2.0;
      if (pet.bodyCondition === 'overweight') kFactor *= 0.85;
      if (pet.bodyCondition === 'underweight') kFactor *= 1.15;
      if (pet.activityLevel === 'high') kFactor *= 1.2;
      if (pet.activityLevel === 'low') kFactor *= 0.9;

      const dailyKcalNeeded = Math.round(rer * kFactor);
      const productKcalPer100g = Math.max(45, Math.round(protein * 3.5 + fat * 8.5 + nfeLabel * 3.5));
      const dailyGrams = Math.max(15, Math.round((dailyKcalNeeded / productKcalPer100g) * 100));

      const doseInfo = {
        dailyGrams,
        perMealGrams: Math.round(dailyGrams / 2),
        dailyKcalNeeded,
        productKcalPer100g
      };

      // Score Base (0-100)
      const scoreA = (product.proteinSourceScore || 18) + (product.carbFatQualityScore || 7) + (product.labelTransparencyScore || 6);
      const isCatFood = product.targetSpecies === 'cat';

      let protPts = isCatFood ? (dmb.protein >= 35 && dmb.protein <= 54 ? 15 : 6) : (dmb.protein >= 22 && dmb.protein <= 38 ? 15 : 9);
      let carbPts = isCatFood ? (dmb.carbs <= 15 ? 10 : dmb.carbs <= 25 ? 6 : 1) : (dmb.carbs <= 35 ? 10 : dmb.carbs <= 46 ? 6 : 2);
      let fatPts = dmb.fat >= 10 && dmb.fat <= 22 ? 5 : 2;
      let ashPts = dmb.ash <= 7.8 ? 5 : dmb.ash <= 9.0 ? 3 : 0;
      const scoreB = protPts + carbPts + fatPts + ashPts;

      let scoreC = 12;
      if (product.hasFunctionalBonus) scoreC += 8;
      if (product.hasAddedSugars) scoreC -= 15;
      if (product.hasChemicalPreservatives) scoreC -= 10;
      scoreC = Math.max(0, Math.min(20, scoreC));

      const baseScore = Math.max(0, Math.min(100, Math.round(scoreA + scoreB + scoreC)));
      let matchScore = baseScore;
      const alerts = [];

      // Controllo Specie
      if (product.targetSpecies !== pet.species) {
        matchScore = 15;
        alerts.push({
          type: 'danger',
          title: `Alimento formulato per specie diversa da ${pet.name}`,
          desc: 'Cani e gatti hanno fabbisogni nutrizionali incompatibili.'
        });
        return { baseScore, matchScore, dmb, doseInfo, alerts };
      }

      // A. CONTROLLO INTOLLERANZE / ALLERGIE SEGNALATE SUL PET
      const triggeredAllergies = [];
      allergies.forEach(alId => {
        const foundOpt = ALLERGY_OPTIONS.find(o => o.id === alId);
        if (foundOpt && foundOpt.keywords.some(kw => ingLower.includes(kw))) {
          triggeredAllergies.push(foundOpt.label.replace(/^[^\s]+\s/, ''));
        }
      });

      if (triggeredAllergies.length > 0) {
        matchScore = 12;
        alerts.push({
          type: 'danger',
          title: `🚨 Contiene ${triggeredAllergies.join(', ')} (Escluso per ${pet.name})`,
          desc: `Negli ingredienti è presente un allergene che hai segnalato nel profilo di ${pet.name}.`
        });
      }

      // B. CONTROLLO ETÀ SENIOR & PROTEZIONE RENALE
      const needsRenalCare = pet.ageYears >= 9 || sensitivities.includes('renal');
      if (needsRenalCare) {
        if (dmb.ash > 7.8 || dmb.protein > 36) {
          matchScore -= 38;
          alerts.push({
            type: 'danger',
            title: `Carico renale elevato per ${pet.name}`,
            desc: `Ceneri al ${dmb.ash}% DMB e Proteine al ${dmb.protein}% DMB: eccessivi per preservare i reni.`
          });
        } else if (triggeredAllergies.length === 0) {
          matchScore += 6;
          alerts.push({
            type: 'success',
            title: `Reni protetti per ${pet.name}`,
            desc: `Ceneri contenute (${dmb.ash}% DMB) e proteine bilanciate (${dmb.protein}% DMB).`
          });
        }
      }

      // C. CONTROLLO FORMA FISICA (SOVRAPPESO)
      if (pet.bodyCondition === 'overweight' && dmb.fat > 15.5) {
        matchScore -= 18;
        alerts.push({
          type: 'warning',
          title: `Grassi elevati (${dmb.fat}% DMB) per controllo peso`,
          desc: `Per mantenere in linea ${pet.name} è preferibile restare sotto il 14% di grassi DMB.`
        });
      }

      // D. CONTROLLO TAGLIA PICCOLA & DENTI SENSIBILI
      const needsMiniKibble = (pet.species === 'dog' && pet.weightKg <= 9) || sensitivities.includes('dental');
      if (needsMiniKibble && product.kibbleSizeMm) {
        if (product.kibbleSizeMm > 10) {
          matchScore -= 16;
          alerts.push({
            type: 'warning',
            title: `Crocchetta grande (${product.kibbleSizeMm} mm) per i denti di ${pet.name}`,
            desc: `Per bocche piccole o denti sensibili è consigliata una crocchetta < 9 mm (o umido).`
          });
        } else if (triggeredAllergies.length === 0) {
          matchScore += 4;
          alerts.push({
            type: 'success',
            title: `Crocchetta Mini (${product.kibbleSizeMm} mm) facile da masticare`,
            desc: `Perfetta per la bocca e i denti di ${pet.name}.`
          });
        }
      }

      // E. ARTICOLAZIONI
      if (sensitivities.includes('joints') && (ingLower.includes('glucosamina') || ingLower.includes('condroitina') || ingLower.includes('artiglio'))) {
        matchScore += 4;
        alerts.push({
          type: 'success',
          title: `Contiene supporto articolare per ${pet.name}`,
          desc: 'Arricchito con condroprotettori (Glucosamina / Condroitina) e Omega-3.'
        });
      }

      // F. ZUCCHERI AGGIUNTI
      if (product.hasAddedSugars) {
        matchScore -= 22;
        alerts.push({
          type: 'danger',
          title: 'Zuccheri aggiunti rilevati in etichetta',
          desc: 'Sconsigliati per denti, peso ed equilibrio glicemico.'
        });
      }

      if (alerts.length === 0) {
        alerts.push({
          type: 'success',
          title: `Ottima compatibilità con ${pet.name}`,
          desc: 'Profilo nutrizionale in linea con età, peso ed esigenze.'
        });
      }

      return {
        baseScore,
        matchScore: Math.max(0, Math.min(100, Math.round(matchScore))),
        dmb,
        doseInfo,
        alerts
      };
    }

    function getBadgeStyle(score) {
      if (score >= 75) return { bg: 'bg-emerald-500', softBg: 'bg-emerald-50', text: 'text-emerald-800', border: 'border-emerald-200', label: 'Eccellente' };
      if (score >= 50) return { bg: 'bg-amber-500', softBg: 'bg-amber-50', text: 'text-amber-800', border: 'border-amber-200', label: 'Discreto' };
      return { bg: 'bg-rose-500', softBg: 'bg-rose-50', text: 'text-rose-800', border: 'border-rose-200', label: 'Sconsigliato' };
    }

        if (q.length < 3) return;
        setIsSearchingSilent(true);
        try {
          const url = `https://world.openpetfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=14`;
          const res = await fetch(url);
          const data = await res.json();
          if (data && Array.isArray(data.products) && data.products.length > 0) {
            const validItems = data.products
              .filter(item => item.product_name || item.product_name_it)

      const handleSavePet = (e) => {
        e.preventDefault();
        if (!petName.trim()) return;
        const petObj = {
          id: editingPetId || `pet-${Date.now()}`,
          name: petName.trim(),
          species: petSpecies,
          breed: petBreed.trim() || (petSpecies === 'dog' ? 'Meticcio' : 'Europeo'),
          ageYears: Number(petAge) || 3,
          weightKg: Number(petWeight) || 5,
          avatarStyle: petAvatar,
          theme: petTheme,
          sterilized: petSterilized,
          bodyCondition: petBodyCondition,
          activityLevel: petActivity,
          allergies: petAllergies,
          sensitivities: petSensitivities
        };

        if (editingPetId) {
          setPets(prev => prev.map(p => p.id === editingPetId ? petObj : p));
          showToast(`Profilo di ${petObj.name} aggiornato!`);
        } else {
          setPets(prev => [...prev, petObj]);
          setActivePetId(petObj.id);
          showToast(`Profilo di ${petObj.name} creato!`);
        }
        setFlowStep('home');
      };

      // Fotocamera Reale Barcode
      const startRealCamera = () => {
        setCameraError('');
        setCameraActive(true);
        setTimeout(() => {
          if (!window.Html5Qrcode) {
            setCameraError('Fotocamera non supportata su questo browser.');
            return;
          }
          const html5QrCode = new window.Html5Qrcode("BarcodeReaderBox");
          qrScannerRef.current = html5QrCode;
          html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 240, height: 130 } },
            (decodedText) => {
              stopRealCamera();
              setEanInput(decodedText);
              lookupBarcodeEAN(decodedText);
            },
            () => {}
          ).catch(() => {
            setCameraError('Permesso fotocamera negato o non disponibile. Inserisci il codice EAN qui sotto.');
            setCameraActive(false);
          });
        }, 200);
      };

      const stopRealCamera = () => {
        if (qrScannerRef.current) {
          qrScannerRef.current.stop().catch(() => {}).finally(() => {
            qrScannerRef.current = null;
            setCameraActive(false);
          });
        } else {
          setCameraActive(false);
        }
      };

      // Ricerca Codice EAN (Trasparente + Fallback aggiunta rapida)
      const lookupBarcodeEAN = async (codeToSearch) => {
        const clean = (codeToSearch || eanInput).trim();
        if (!clean) return;
        const localHit = products.find(p => p.ean === clean);
        if (localHit) {
          setSelectedProductId(localHit.id);
          setShowScannerModal(false);
          setOpenAccordion('');
          setFlowStep('product');
          showToast(`Prodotto trovato: ${localHit.name}`);
          return;
        }

        setEanLoading(true);
        try {
          const res = await fetch(`https://world.openpetfoodfacts.org/api/v0/product/${clean}.json`);
          const data = await res.json();
          if (data && data.status === 1 && data.product) {
            const imported = normalizeExternalFoodItem({ ...data.product, code: clean });
            setProducts(prev => [imported, ...prev]);
            setSelectedProductId(imported.id);
            setShowScannerModal(false);
            setOpenAccordion('');
            setFlowStep('product');
            if (supabaseClient) {
              supabaseClient.from('products').upsert([{ id: imported.id, ean: imported.ean, product_data: imported }]).then(() => {});
            }
            showToast('Prodotto analizzato con successo!');
          } else {
            setShowScannerModal(false);
            setNewProdEan(clean);
            setShowAddProductModal(true);
          }
        } catch (err) {
          showToast('Verifica la connessione internet.');
        } finally {
          setEanLoading(false);
        }
      };

      // Aggiunta nuovo prodotto (con salvataggio e contributo silenzioso a Open Pet Food Facts)
      const handleCreateNewProduct = async (e) => {
        e.preventDefault();
        if (!newProdName.trim()) return;
        const code = newProdEan.trim() || String(Math.floor(8000000000000 + Math.random() * 900000000000));
        const createdProd = {
          id: `prod-${code}`,
          ean: code,
          category: newProdCat,
          subCategory: newProdCat === 'food' ? '🥣 Cibo Pet' : '🛡️ Accessori & Cura',
          targetSpecies: activePet.species,
          name: newProdName.trim(),
          brand: newProdBrand.trim() || 'Linea Pet',
          priceAvg: 'Vedi offerte',
          confidenceScore: 90,
          kibbleSizeMm: newProdCat === 'food' ? 9 : null,
          ingredientsText: newProdIng.trim() || 'Ingredienti inseriti dalla community.',
          proteinSourceScore: 21, carbFatQualityScore: 8, labelTransparencyScore: 8,
          hasAddedSugars: false, hasChemicalPreservatives: false, hasFunctionalBonus: true,
          analytical: {
            protein: Number(newProdProt) || 25,
            fat: Number(newProdFat) || 13,
            fiber: 3.0,
            ash: Number(newProdAsh) || 6.5,
            moisture: 10.0
          },
          nonFoodBaseTechScore: 88,
          nonFoodMetrics: [
            { label: 'Sicurezza Componenti', score: 90 },
            { label: 'Tollerabilità per il Pet', score: 88 }
          ],
          prices: [
            { store: 'Amazon', price: 'Cerca offerta', note: 'Ricerca diretta', url: `https://www.amazon.it/s?k=${encodeURIComponent(newProdBrand + ' ' + newProdName)}` }
          ],
          reviews: []
        };

        setProducts(prev => [createdProd, ...prev]);
        setSelectedProductId(createdProd.id);
        setShowAddProductModal(false);
        setOpenAccordion('');
        setFlowStep('product');

        // 1. Salva nel nostro Cloud
        if (supabaseClient) {
          supabaseClient.from('products').upsert([{ id: createdProd.id, ean: createdProd.ean, product_data: createdProd }]).then(() => {});
        }

        // 2. Se è un alimento, contribuisci silenziosamente anche a Open Pet Food Facts
        if (newProdCat === 'food') {
          try {
            const formData = new URLSearchParams();
            formData.append('code', code);
            formData.append('product_name', createdProd.name);
            formData.append('brands', createdProd.brand);
            formData.append('ingredients_text', createdProd.ingredientsText);
            fetch('https://world.openpetfoodfacts.org/cgi/product_jqm2.pl', {
              method: 'POST',
              mode: 'no-cors',
              body: formData
            }).catch(() => {});
          } catch (_) {}
        }

        showToast('Prodotto aggiunto e valutato per ' + activePet.name + '!');
      };

      // Invio Recensione
      const handleSendReview = async (e) => {
        e.preventDefault();
        if (!revComment.trim()) return;
        const author = revAuthor.trim() || `Proprietario di ${activePet.name}`;
        const petDesc = `${activePet.breed} • ${activePet.ageYears} anni • ${activePet.weightKg} kg`;

        const newRev = {
          id: `rev-${Date.now()}`,
          userName: author,
          petInfo: petDesc,
          rating: Number(revRating),
          pros: revPros.trim() || 'Ottima riuscita',
          cons: revCons.trim() || 'Nessuno',
          comment: revComment.trim(),
          verifiedScan: true
        };

        setProducts(prev => prev.map(p => p.id === selectedProduct.id ? { ...p, reviews: [newRev, ...p.reviews] } : p));
        setRevComment(''); setRevPros(''); setRevCons('');

        if (supabaseClient) {
          await supabaseClient.from('reviews').insert([{
            product_id: selectedProduct.id,
            product_name: selectedProduct.name,
            user_name: author,
            pet_info: petDesc,
            rating: Number(revRating),
            pros: newRev.pros,
            cons: newRev.cons,
            comment: newRev.comment,
            verified_scan: true
          }]);
        }
        showToast('Grazie! La tua recensione è online.');
      };

      const handleSendFeedback = async (e) => {
        e.preventDefault();
        if (!fbMessage.trim()) return;
        if (supabaseClient) {
          await supabaseClient.from('beta_feedback').insert([{
            tester_name: fbName.trim() || 'Amico Tester',
            feedback_type: fbType,
            message: fbMessage.trim()
          }]);
        }
        showToast('Grazie! Suggerimento ricevuto.');
        setFbMessage('');
        setShowFeedbackModal(false);
      };

      // Pillole priorità visibili nella Hero Card del Pet in Home (Massimo 3-4 per UX minimale)
      const activePetBadges = useMemo(() => {
        const list = [];
        if (activePet.ageYears >= 9 && !activePet.sensitivities?.includes('renal')) {
          list.push('🛡️ Senior: Reni Protetti');
        }
        (activePet.sensitivities || []).forEach(sId => {
          const found = SENSITIVITY_OPTIONS.find(o => o.id === sId);
          if (found) list.push(found.shortBadge);
        });
        (activePet.allergies || []).forEach(aId => {
          const found = ALLERGY_OPTIONS.find(o => o.id === aId);
          if (found) list.push(found.label);
        });
        if (list.length === 0) {
          list.push(activePet.species === 'cat' ? '🐱 Carnivoro Stretto' : '🐶 Mantenimento Equilibrato');
        }
        return list.slice(0, 4);
      }, [activePet]);

      return (
        <div className="min-h-screen bg-slate-100 flex flex-col items-center pb-24">

            <div className="fixed top-4 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-2xl shadow-xl text-xs font-bold flex items-center gap-2 animate-bounce">
              <span>✨</span> {toastMsg}

              <span className="font-black text-slate-900 tracking-tight text-sm">PetScore</span>

            <div className="flex items-center gap-2">
              <button onClick={() => setShowGlossaryModal(true)} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-xl font-bold text-[11px]">

              <button onClick={() => setShowFeedbackModal(true)} className="bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200 px-2.5 py-1 rounded-xl font-bold text-[11px]">
                💬 Suggerimenti

            {/* 1. SCHERMATA BENVENUTO */}

                <div className="mb-4">
                  <PetAvatarSVG style="pinscher" theme="peach" size={112} />

                <span className="text-[11px] font-extrabold uppercase tracking-wider px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 mb-3">
                  Nutrizione & Cura Indipendente

                <h1 className="text-2xl font-extrabold text-slate-900 mb-2 leading-tight">

                <p className="text-sm text-slate-600 mb-6 leading-relaxed">
                  Scansiona o cerca crocchette, umido, antiparassitari e lettiere: scopri subito il <strong>Match %</strong> calcolato per l'età, il peso e le intolleranze del tuo cane o gatto.
                </p>
                <div className="w-full space-y-2.5">
                  <button onClick={() => setFlowStep('home')} className="w-full py-3.5 rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-sm shadow-md transition">
                    Inizia subito (Profilo Ercole) →
                  </button>
                  <button onClick={() => openPetEditor(null)} className="w-full py-3 rounded-2xl bg-white border border-slate-200 text-slate-700 font-bold text-xs hover:bg-slate-100 transition">
                    + Personalizza il tuo Cane o Gatto
                  </button>
                </div>
              </div>

                  <button onClick={() => setFlowStep('home')} className="text-xs font-bold text-slate-500 bg-white px-3 py-1 rounded-xl border border-slate-200">
                    Chiudi ✕
                  </button>
                </div>

                {/* Anteprima Live Avatar & Palette Pastello */}
                <div className="rounded-3xl p-4 border shadow-sm flex items-center gap-4 transition-all" style={{ backgroundColor: PASTEL_THEMES[petTheme]?.bg || '#DCFCE7', borderColor: PASTEL_THEMES[petTheme]?.border || '#A7F3D0' }}>
                  <PetAvatarSVG style={petAvatar} theme={petTheme} size={74} />
                  <div className="flex-1 min-w-0">
                    <div className="text-lg font-extrabold text-slate-900 truncate">{petName || 'Il tuo Pet'}</div>
                    <div className="text-xs font-semibold text-slate-700">{petBreed || (petSpecies === 'dog' ? 'Cane' : 'Gatto')} • {petAge} anni • {petWeight} kg</div>
                    <div className="flex gap-1.5 mt-2.5">
                      {Object.keys(PASTEL_THEMES).map(k => (
                        <button
                          key={k}
                          type="button"
                          onClick={() => setPetTheme(k)}
                          className={`w-6 h-6 rounded-full border-2 transition ${petTheme === k ? 'border-slate-900 scale-110 shadow-sm' : 'border-white/80'}`}
                          style={{ backgroundColor: PASTEL_THEMES[k].bg }}
                          title={PASTEL_THEMES[k].name}
                        />
                      ))}
                    </div>
                  </div>
                </div>

                <form onSubmit={handleSavePet} className="space-y-4">
                  {/* Blocco 1: Identità & Stile Avatar */}
                  <div className="bg-white p-4 rounded-3xl border border-slate-200/80 shadow-sm space-y-3">
                    <div className="text-xs font-extrabold uppercase tracking-wider text-slate-400">1. Specie & Stile Illustrazione</div>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        type="button"
                        onClick={() => { setPetSpecies('dog'); setPetAvatar('pinscher'); }}
                        className={`py-2.5 rounded-2xl font-bold text-xs border transition ${petSpecies === 'dog' ? 'bg-slate-900 text-white border-slate-900' : 'bg-slate-50 border-slate-200 text-slate-600'}`}
                      >
                        🐶 Cane
                      </button>
                      <button
                        type="button"
                        onClick={() => { setPetSpecies('cat'); setPetAvatar('cat_tabby'); }}
                        className={`py-2.5 rounded-2xl font-bold text-xs border transition ${petSpecies === 'cat' ? 'bg-slate-900 text-white border-slate-900' : 'bg-slate-50 border-slate-200 text-slate-600'}`}
                      >
                        🐱 Gatto
                      </button>
                    </div>

                    {/* Griglia Avatar Flat */}
                    <div className="flex gap-2 overflow-x-auto no-scrollbar py-1">
                      {AVATAR_STYLES.filter(a => a.species === petSpecies).map(av => (
                        <button
                          key={av.id}
                          type="button"
                          onClick={() => setPetAvatar(av.id)}
                          className={`p-2 rounded-2xl border flex flex-col items-center gap-1 shrink-0 transition ${
                            petAvatar === av.id ? 'border-emerald-500 bg-emerald-50/60 ring-2 ring-emerald-500/20' : 'border-slate-200 bg-slate-50'
                          }`}
                        >
                          <PetAvatarSVG style={av.id} theme={petTheme} size={44} />
                          <span className="text-[10px] font-bold text-slate-700">{av.label}</span>
                        </button>
                      ))}
                    </div>

                    <div className="grid grid-cols-2 gap-2.5 pt-1">
                      <div>
                        <label className="text-[11px] font-bold text-slate-600">Nome *</label>
                        <input type="text" required value={petName} onChange={e => setPetName(e.target.value)} placeholder="Es. Ercole, Mia..." className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-xs font-semibold" />
                      </div>
                      <div>
                        <label className="text-[11px] font-bold text-slate-600">Razza / Tipo</label>
                        <input type="text" value={petBreed} onChange={e => setPetBreed(e.target.value)} placeholder="Es. Pinscher, Europeo..." className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-xs" />
                      </div>
                    </div>
                  </div>

                  {/* Blocco 2: Età, Peso e Forma Fisica */}
                  <div className="bg-white p-4 rounded-3xl border border-slate-200/80 shadow-sm space-y-3">
                    <div className="text-xs font-extrabold uppercase tracking-wider text-slate-400">2. Età, Peso & Stile di Vita</div>
                    <div className="grid grid-cols-2 gap-3">
                      <div className="bg-slate-50 p-2.5 rounded-2xl border border-slate-200/70">
                        <div className="flex justify-between text-xs font-bold text-slate-700">
                          <span>Età</span>
                          <span className="text-emerald-700">{petAge} {petAge === 1 ? 'anno' : 'anni'}</span>
                        </div>
                        <input type="range" min="1" max="20" value={petAge} onChange={e => setPetAge(Number(e.target.value))} className="w-full accent-emerald-500 mt-1.5" />
                      </div>
                      <div className="bg-slate-50 p-2.5 rounded-2xl border border-slate-200/70">
                        <div className="flex justify-between text-xs font-bold text-slate-700">
                          <span>Peso</span>
                          <span className="text-emerald-700">{petWeight} kg</span>
                        </div>
                        <input type="range" min="1" max="55" step="0.5" value={petWeight} onChange={e => setPetWeight(Number(e.target.value))} className="w-full accent-emerald-500 mt-1.5" />
                      </div>
                    </div>

                    <div>
                      <div className="text-[11px] font-bold text-slate-600 mb-1.5">Forma Fisica</div>
                      <div className="grid grid-cols-3 gap-1.5">
                        {[
                          { id: 'underweight', label: 'Snello / Sottopeso' },
                          { id: 'ideal', label: '✨ Peso Forma' },
                          { id: 'overweight', label: 'Tende a Ingrassare' }
                        ].map(b => (
                          <button
                            key={b.id}
                            type="button"
                            onClick={() => setPetBodyCondition(b.id)}
                            className={`py-2 px-2 rounded-xl text-[11px] font-bold border transition ${
                              petBodyCondition === b.id ? 'bg-slate-900 text-white border-slate-900' : 'bg-slate-50 text-slate-600 border-slate-200'
                            }`}
                          >
                            {b.label}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="flex items-center justify-between pt-1">
                      <span className="text-xs font-bold text-slate-700">Il Pet è sterilizzato?</span>
                      <button

                      {ALLERGY_OPTIONS.map(al => {

                            {al.label} {active && '✓'}

                  {/* Blocco 4: Esigenze Cliniche & Cura */}

                            {sens.label} {active && '✓'}
                          </button>
                        );
                      })}
                    </div>

                  <button type="submit" className="w-full py-3.5 rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold text-sm shadow-md transition">

                  </button>
                </form>

            {/* 3. HOMEPAGE PET-CENTRICA & RICERCA UNIFICATA */}
            {flowStep === 'home' && (
              <div className="p-4 space-y-4">

                <div className="flex items-center gap-2 overflow-x-auto no-scrollbar pb-0.5">
                  {pets.map(p => (
                    <button

                      onClick={() => setActivePetId(p.id)}
                      className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold border transition shrink-0 ${

                <div

                >

                <form onSubmit={handleCreateNewProduct} className="space-y-2.5 text-xs">
                  <div className="grid grid-cols-2 gap-2">
                    <button type="button" onClick={() => setNewProdCat('food')} className={`py-2 rounded-xl font-bold border ${newProdCat === 'food' ? 'bg-slate-900 text-white' : 'bg-slate-50 text-slate-600'}`}>🥣 Cibo / Snack</button>
                    <button type="button" onClick={() => setNewProdCat('non-food')} className={`py-2 rounded-xl font-bold border ${newProdCat === 'non-food' ? 'bg-slate-900 text-white' : 'bg-slate-50 text-slate-600'}`}>🛡️ Non-Food</button>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <input type="text" required value={newProdBrand} onChange={e => setNewProdBrand(e.target.value)} placeholder="Marca (es. Monge)" className="px-3 py-2 rounded-xl border border-slate-200" />
                    <input type="text" value={newProdEan} onChange={e => setNewProdEan(e.target.value)} placeholder="Codice EAN (opz.)" className="px-3 py-2 rounded-xl border border-slate-200 font-mono" />
                  </div>
                  <input type="text" required value={newProdName} onChange={e => setNewProdName(e.target.value)} placeholder="Nome prodotto (es. Crocchette Salmone)" className="w-full px-3 py-2 rounded-xl border border-slate-200" />
                  <textarea rows="2" value={newProdIng} onChange={e => setNewProdIng(e.target.value)} placeholder="Primi ingredienti scritti sull'etichetta..." className="w-full px-3 py-2 rounded-xl border border-slate-200"></textarea>

                  {newProdCat === 'food' && (
                    <div className="grid grid-cols-3 gap-2 pt-1">
                      <div>
                        <label className="text-[10px] font-bold text-slate-500">% Proteine</label>
                        <input type="number" step="0.5" value={newProdProt} onChange={e => setNewProdProt(e.target.value)} className="w-full px-2.5 py-1.5 rounded-xl border border-slate-200 font-bold" />
                      </div>
                      <div>
                        <label className="text-[10px] font-bold text-slate-500">% Grassi</label>
                        <input type="number" step="0.5" value={newProdFat} onChange={e => setNewProdFat(e.target.value)} className="w-full px-2.5 py-1.5 rounded-xl border border-slate-200 font-bold" />
                      </div>
                      <div>
                        <label className="text-[10px] font-bold text-slate-500">% Ceneri</label>
                        <input type="number" step="0.5" value={newProdAsh} onChange={e => setNewProdAsh(e.target.value)} className="w-full px-2.5 py-1.5 rounded-xl border border-slate-200 font-bold" />
                      </div>
                    </div>
                  )}

                  <div className="p-2.5 rounded-xl bg-emerald-50 text-[11px] text-emerald-800 font-medium">
                    🌱 Aggiungendo un alimento contribuisci anche ad arricchire la rete gratuita mondiale <strong>Open Pet Food Facts</strong>.
                  </div>

                  <button type="submit" className="w-full py-3 rounded-2xl bg-emerald-500 text-white font-extrabold">
                    Calcola Punteggio & Salva
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* MODALE LINEE GUIDA & ACRONIMI (SENZA FORMULE) */}
          {showGlossaryModal && (
            <div className="fixed inset-0 bg-slate-900/75 z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-3xl p-5 space-y-3 max-h-[85vh] overflow-y-auto">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-extrabold text-slate-900">📖 Linee Guida & Significato Indici</h3>
                  <button onClick={() => setShowGlossaryModal(false)} className="text-xs font-bold text-slate-500">Chiudi ✕</button>
                </div>
                <p className="text-xs text-slate-600 leading-relaxed">
                  PetScore valuta i prodotti in modo 100% indipendente seguendo i parametri nutrizionali veterinari europei. Nessun produttore può pagare per modificare i punteggi.
                </p>
                <div className="space-y-2">
                  {ACRONYM_GLOSSARY.map(item => (
                    <div key={item.code} className="p-3 rounded-2xl bg-slate-50 border border-slate-200">
                      <div className="text-xs font-extrabold text-emerald-800">{item.code} — {item.name}</div>
                      <div className="text-[11px] text-slate-600 mt-0.5 leading-relaxed">{item.desc}</div>
                    </div>
                  ))}
                </div>
                <div className="p-3 rounded-2xl bg-emerald-50 border border-emerald-200 text-[11px] text-emerald-900">
                  🌱 <strong>Insieme per la trasparenza:</strong> PetScore supporta e contribuisce attivamente alla rete mondiale aperta <strong>Open Pet Food Facts</strong> per rendere i dati nutrizionali accessibili a tutti.
                </div>
              </div>
            </div>
          )}

          {/* MODALE SUGGERIMENTI BETA TESTER */}
          {showFeedbackModal && (
            <div className="fixed inset-0 bg-slate-900/75 z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-3xl p-5 space-y-3">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-extrabold text-slate-900">💬 Invia un suggerimento</h3>
                  <button onClick={() => setShowFeedbackModal(false)} className="text-xs font-bold text-slate-500">Chiudi ✕</button>
                </div>
                <form onSubmit={handleSendFeedback} className="space-y-3 text-xs">
                  <input type="text" value={fbName} onChange={e => setFbName(e.target.value)} placeholder="Il tuo nome" className="w-full px-3 py-2 rounded-xl border border-slate-200" />
                  <select value={fbType} onChange={e => setFbType(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-200 font-bold">
                    <option value="Suggerimento">💡 Idea o miglioramento</option>
                    <option value="Prodotto Mancante">📦 Prodotto che vorrei trovare</option>
                    <option value="Segnalazione">🐞 Qualcosa non funziona</option>
                  </select>
                  <textarea required rows="3" value={fbMessage} onChange={e => setFbMessage(e.target.value)} placeholder="Scrivi qui il tuo messaggio..." className="w-full px-3 py-2 rounded-xl border border-slate-200"></textarea>
                  <button type="submit" className="w-full py-3 rounded-2xl bg-emerald-500 text-white font-extrabold">
                    Invia Messaggio
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
